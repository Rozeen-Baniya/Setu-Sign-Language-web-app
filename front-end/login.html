<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Setu</title>
    <link rel="icon" href="images/hhf.png" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="header-shell">
        <nav class="nav-container">
          <a href="home.html" class="logo">
            <img src="images/hhf.png" alt="Setu Logo" class="logo-icon" />
          </a>
          <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="transcribe.html">Transcribe</a></li>
            <li><a href="about.html">About us</a></li>
          </ul>
          <a href="login.html" class="login-btn active">Login</a>
        </nav>
      </div>
    </header>
    <section class="login-section">
      <div class="login-card">
        <h2>Login to Setu</h2>
        <form>
          <div style="display: flex; flex-direction: column; gap: 0.3rem">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.3rem">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="*******"
              required
            />
            <div
              id="password-error"
              style="
                color: red;
                font-size: 0.95rem;
                margin-top: 0.2rem;
                display: none;
              "
            ></div>
          </div>
          <button type="submit" class="login-btn-main">Login</button>
        </form>

        <div class="signup-link">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </div>
    </section>
    <script src="auth.js"></script>
    <script>
      const form = document.querySelector("form");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const passwordError = document.getElementById("password-error");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        passwordError.style.display = "none";
        passwordError.textContent = "";

        const email = emailInput.value;
        const password = passwordInput.value;

        // Check if user exists in localStorage
        const users = JSON.parse(localStorage.getItem('setuUsers') || '[]');
        const user = users.find(u => u.email === email && u.password === password);

        if (user) {
          auth.login({ username: user.username, email: user.email });
          alert("Login successful!");
          window.location.href = 'home.html';
        } else {
          passwordError.style.display = "block";
          passwordError.textContent = "Invalid email or password.";
        }
      });
      

    </script>
  </body>
</html>
