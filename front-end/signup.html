<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Setu</title>
    <link rel="icon" href="images/hhf.png">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="header-shell">
            <nav class="nav-container">
                <a href="home.html" class="logo">
                    <img src="images/hhf.png" alt="Setu Logo" class="logo-icon">
                </a>
                <ul class="nav-links">
                    <li><a href="home.html" class="active">Home</a></li>
                    <li><a href="transcribe.html">Transcribe</a></li>
                    <li><a href="about.html">About us</a></li>
                </ul>
                <a href="login.html" class="login-btn">Login</a>
            </nav>
        </div>
    </header>

    <section class="signup-section">
        <div class="container">
            <div class="signup-box">
                <h2>Sign Up</h2>
                <form id="signupForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>
                    <button type="submit" class="signup-btn">Sign Up</button>
                    <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="transcribe.html">Transcribe</a></li>
                    <li><a href="about.html">About us</a></li>
                    <li><a href="about.html#contact-us">Contact us</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Download the Setu App for free</h3>
                <div class="app-store-buttons">
                    <a href="#" class="app-store-btn">
                        <img src="images/googleplay.PNG" alt="Google Play">
                    </a>
                    <a href="#" class="app-store-btn">
                        <img src="images/appstore.PNG" alt="App Store">
                    </a>
                </div>
            </div>
            <div class="footer-section">
                <h3>Contact</h3>
                <div class="contact-info">
                    <div class="contact-item">
                        <img src="images/email.PNG" alt="Email Icon" class="contact-icon">
                        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=setuofficial.info@gmail.com" target="_blank">setuofficial.info@gmail.com</a>
                    </div>
                    <div class="contact-item">
                        <img src="images/phonee.PNG" alt="Phone Icon" class="contact-icon">
                        <span>+977 9848000000</span>
                    </div>
                    <div class="contact-item">
                        <img src="images/locationn.PNG" alt="Location Icon" class="contact-icon">
                        <a href="https://www.google.com/maps/search/?api=1&query=Maitidevi+Kathmandu" target="_blank" class="location-link">
                            Maitidevi, Kathmandu
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="copyright">
            <p>© 2025 Setu, All Rights Reserved.</p>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script src="signup.js"></script>
</body>
</html>
